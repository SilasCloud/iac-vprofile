name: "Vprofile IAC"

on:
  push:
    branches:
      - main
      - stage
    paths:
      - '**/*.tf'
      - terraform/**

  pull_request:
    branches:
      - main
      - stage
    paths:
      - '**/*.tf'
      - terraform/**

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  BUCKET_TF_BUCKET: ${{ secrets.BUCKET_TF_BUCKET }}
  AWS_REGION: "us-east-1"
  EKS_CLUSTER_NAME: vprofile-eks

jobs:
  terraform:
    name: "apply terraform code changes"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Install Terraform  # 👈 This step fixes the issue
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.6.3

    - name: Terraform Init
      id: init
      run: terraform init -backend-config="bucket=$BUCKET_TF_BUCKET" -backend-config="region=$AWS_REGION"

    - name: Terraform format
      id: format
      run: terraform fmt -check

    - name: Terraform validate
      id: validate
      run: terraform validate

    - name: Terraform plan
      id: plan
      run: terraform plan -no-color -input=false -out planfile
      continue-on-error: true

    - name: Terraform plan status
      if: steps.plan.outcome == 'failure'
      run: exit 1
